name: Frontend checks

on:
  pull_request:
    paths:
      - 'bolt-app/**'
      - '.github/workflows/frontend-*.yml'
      - '.github/workflows/deploy.yml'
  push:
    branches: [main]
    paths:
      - 'bolt-app/**'
      - '.github/workflows/frontend-*.yml'
      - '.github/workflows/deploy.yml'

permissions:
  contents: read

jobs:
  check:
    uses: ./.github/workflows/frontend-validate.yml
    with:
      ref: ${{ github.sha }}
