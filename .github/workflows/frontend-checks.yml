name: Frontend checks

on:
  pull_request:
    paths:
      - 'bolt-app/**'
      - '.github/workflows/frontend-checks.yml'
  push:
    branches: [main]
    paths:
      - 'bolt-app/**'
      - '.github/workflows/frontend-checks.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bolt-app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: bolt-app/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - name: Test in multiple timezones
        run: |
          for timezone in UTC Europe/Paris America/Los_Angeles Asia/Tokyo; do
            TZ="$timezone" npm test || exit 1
          done
      - run: npm run build
