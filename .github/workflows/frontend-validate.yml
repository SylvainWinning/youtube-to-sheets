name: Validate frontend artifact

on:
  workflow_call:
    inputs:
      ref:
        required: true
        type: string
      publish-artifact:
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Official browsers and Linux libraries, pinned to the npm lockfile version.
    # Avoid an apt mirror install in every validation/publication job.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:47b510dd9230bf0b9bfc9b20102241e577ea7a99334ab4c3ca19f19770e9b8ea
      options: --shm-size=1g
    defaults:
      run:
        working-directory: bolt-app
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - name: Confirm the pinned revision
        env:
          EXPECTED_REVISION: ${{ inputs.ref }}
        # checkout and shell steps have different home directories in containers;
        # trust only this checkout for this read, without a global wildcard.
        run: test "$(git -c safe.directory="$GITHUB_WORKSPACE" rev-parse HEAD)" = "$EXPECTED_REVISION"
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: bolt-app/package-lock.json
      - run: npm ci
      - run: npm run audit
      - run: npm run lint
      - name: Test in multiple timezones
        run: |
          for timezone in UTC Europe/Paris America/Los_Angeles Asia/Tokyo; do
            TZ="$timezone" npm test || exit 1
          done
      # build includes the TypeScript check. UI tests exercise this exact dist/.
      - run: npm run build
      - run: npm run test:ui
      - name: Preserve UI evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: ui-evidence-${{ inputs.ref }}
          path: |
            bolt-app/playwright-report
            bolt-app/test-results
          retention-days: 7
      # Default success condition is deliberate: never upload an artifact after
      # failed checks, and never rebuild between the UI tests and publication.
      - name: Upload the validated Pages artifact
        if: ${{ success() && inputs.publish-artifact }}
        uses: actions/upload-pages-artifact@v5
        with:
          name: github-pages-${{ inputs.ref }}
          path: bolt-app/dist
