name: Export Google Sheet to public data

on:
  workflow_dispatch:
  # Export ponctuel des modifications faites dans Sheets. La synchronisation
  # planifiée produit déjà les fichiers publics : aucun second planning ici.

permissions:
  contents: write

concurrency:
  group: youtube-library-data-${{ github.event.pull_request.number || 'production' }}
  cancel-in-progress: false

jobs:
  export:
    # ne lance le workflow qu’après la réussite d’un workflow_run
    if: ${{ github.event.name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Export sheet to CSV/JSON
        env:
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          SERVICE_ACCOUNT_JSON: ${{ secrets.SERVICE_ACCOUNT_JSON }}
          SHEET_RANGE: "AllVideos!A1:Q"
        run: python scripts/export_sheet.py --sheet-range "$SHEET_RANGE"

      - name: Commit & push CSV and JSON update
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          python scripts/publish_generated_data.py "chore: update exported data" \
            bolt-app/public/data/videos.csv bolt-app/public/data/videos.json
  
    
