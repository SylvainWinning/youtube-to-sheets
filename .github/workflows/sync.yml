name: YouTube to Sheets Sync

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/sync.yml"
      - "main.py"
      - "sync_metadata.py"
      - "category_rules.py"
      - "export_data.py"
      - "scripts/export_sheet.py"
      - "scripts/publish_generated_data.py"
      - ".github/workflows/export-sheets.yml"
      - "tests/**"
  pull_request:
    paths: ["category_rules.py", "main.py", "sync_metadata.py", "export_data.py", "scripts/export_sheet.py", "scripts/publish_generated_data.py", "tests/**", ".github/workflows/sync.yml", ".github/workflows/export-sheets.yml"]
  # Lancement manuel si besoin
  workflow_dispatch:
  # Trois synchronisations quotidiennes, avec changement d'heure automatique.
  schedule:
    - cron: '30 12 * * *'
      timezone: 'Europe/Paris'
    - cron: '0 20 * * *'
      timezone: 'Europe/Paris'
    - cron: '30 22 * * *'
      timezone: 'Europe/Paris'

# Donne l'accès en écriture afin de pouvoir mettre à jour le dépôt avec
# les fichiers générés (par ex. data/videos.json)
permissions:
  contents: write

concurrency:
  group: youtube-library-data-${{ github.event.pull_request.number || 'production' }}
  cancel-in-progress: false

jobs:
  tests:
    name: Run unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      revision: ${{ steps.revision.outputs.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.sha || 'main' }}
      - name: Pin the tested revision
        id: revision
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Run tests
        run: pytest -q

  sync:
    name: Sync playlist to Google Sheets
    if: github.event_name != 'pull_request'
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
      SERVICE_ACCOUNT_JSON: ${{ secrets.SERVICE_ACCOUNT_JSON }}
      PLAYLIST_ID: PLtBV_WamBQbAxyF08PXaPxfFwcTejP9vR,PLtBV_WamBQbCWySxrSDkbEcTYsxZ8FOvx
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.tests.outputs.revision }}
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Sanity check secrets
        run: |
          test -n "${YOUTUBE_API_KEY}" || (echo "Secret YOUTUBE_API_KEY manquant" && exit 1)
          test -n "${SPREADSHEET_ID}" || (echo "Secret SPREADSHEET_ID manquant" && exit 1)
          test -n "${SERVICE_ACCOUNT_JSON}" || (echo "Secret SERVICE_ACCOUNT_JSON manquant" && exit 1)
      - name: Write Google service account key
        run: |
          python - <<'PY'
          import os, json, sys, base64
          raw = os.environ.get("SERVICE_ACCOUNT_JSON", "")
          def try_write(content: str) -> bool:
              try:
                  json.loads(content)
              except json.JSONDecodeError:
                  return False
              else:
                  with open("service_account.json", "w", encoding="utf-8") as f:
                      f.write(content)
                  return True
          if try_write(raw): sys.exit(0)
          fixed = raw.replace("\n", "\n").replace("\r", "\r")
          if try_write(fixed): sys.exit(0)
          try:
              decoded = base64.b64decode(raw).decode("utf-8", "strict")
              if try_write(decoded): sys.exit(0)
          except Exception:
              pass
          print("SERVICE_ACCOUNT_JSON n'est pas un JSON valide.")
          sys.exit(1)
          PY
      - name: Run sync
        id: synchronization
        continue-on-error: true
        run: python main.py "$PLAYLIST_ID"
      - name: Commit data and push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          python scripts/publish_generated_data.py "Update videos data" \
            bolt-app/public/data/videos.csv bolt-app/public/data/videos.json \
            data/videos.json bolt-app/src/data/categoryRules.json

      - name: Report synchronization failure
        if: steps.synchronization.outcome == 'failure'
        run: exit 1
