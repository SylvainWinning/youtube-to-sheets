name: YouTube to Sheets Sync
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install requests
      - name: Diagnose unavailable videos (read only)
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          PLAYLIST_ID: PLtBV_WamBQbAxyF08PXaPxfFwcTejP9vR,PLtBV_WamBQbCWySxrSDkbEcTYsxZ8FOvx
        run: python scripts/diagnose_unavailable.py
