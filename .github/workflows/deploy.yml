name: Build and deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_run:
    workflows: ["YouTube to Sheets Sync", "Export Google Sheet to public data"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  resolve:
    if: ${{ github.event_name != 'workflow_run' || (github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository && (github.event.workflow_run.conclusion == 'success' || (github.event.workflow_run.name == 'YouTube to Sheets Sync' && github.event.workflow_run.conclusion == 'failure'))) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      revision: ${{ steps.revision.outputs.sha }}
    steps:
      # Sync/export can commit the JSON during their run. Resolve main once,
      # then pin every validation/build step to that exact commit.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_run' && 'main' || github.sha }}
      - id: revision
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  validate:
    needs: resolve
    permissions:
      contents: read
    uses: ./.github/workflows/frontend-validate.yml
    with:
      ref: ${{ needs.resolve.outputs.revision }}
      publish-artifact: true

  deploy:
    needs: [resolve, validate]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy-pages.outputs.page_url || steps.deploy-pages-retry-1.outputs.page_url || steps.deploy-pages-retry-2.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6
      # 7. Déploie vers GitHub Pages
      - name: Deploy to GitHub Pages
        id: deploy-pages
        uses: actions/deploy-pages@v5
        continue-on-error: true
        with:
          token: ${{ github.token }}
          artifact_name: github-pages-${{ needs.resolve.outputs.revision }}

      - name: Wait before retrying GitHub Pages deployment
        if: ${{ steps.deploy-pages.outcome == 'failure' }}
        run: sleep 90

      - name: Retry deploy to GitHub Pages
        id: deploy-pages-retry-1
        if: ${{ steps.deploy-pages.outcome == 'failure' }}
        uses: actions/deploy-pages@v5
        continue-on-error: true
        with:
          token: ${{ github.token }}
          artifact_name: github-pages-${{ needs.resolve.outputs.revision }}

      - name: Wait before final GitHub Pages deployment retry
        if: ${{ steps.deploy-pages.outcome == 'failure' && steps.deploy-pages-retry-1.outcome == 'failure' }}
        run: sleep 180

      - name: Final retry deploy to GitHub Pages
        id: deploy-pages-retry-2
        if: ${{ steps.deploy-pages.outcome == 'failure' && steps.deploy-pages-retry-1.outcome == 'failure' }}
        uses: actions/deploy-pages@v5
        with:
          token: ${{ github.token }}
          artifact_name: github-pages-${{ needs.resolve.outputs.revision }}
